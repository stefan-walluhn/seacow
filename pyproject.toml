[project]
name = "seacow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Stefan", email = "stefan@neuland.io" }
]
requires-python = ">=3.13"
dependencies = [
    "environs>=15.2.0",
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "paho-mqtt>=2.1.0",
]

[project.scripts]
seacow = "seacow.client:client"

[build-system]
requires = ["uv_build>=0.12.23,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
    "ruff>=0.16.10",
]

[tool.pyrefly]
preset="strict"

[tool.uv]
python-downloads = "never"
python-preference = "system"
